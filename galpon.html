<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Centro de Simuladores — Gemelo Digital SCADA</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#111; font-family:'Segoe UI', Arial, sans-serif; }
  #ui {
    position:absolute; top:12px; left:12px; z-index:100;
    background:rgba(15,15,18,.92); color:#eee; padding:14px 18px;
    border-radius:9px; border:1px solid #383a45; font-size:13px; line-height:1.6;
    backdrop-filter: blur(8px); max-width:310px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  #ui h3 { font-size:13.5px; margin-bottom:8px; color:#ffd75e; text-transform:uppercase; letter-spacing:0.5px; }
  #ui .fila { margin-bottom:8px; display:flex; gap:6px; }
  #ui .fila button {
    flex:1; padding:7px 8px; cursor:pointer;
    background:#222329; color:#eee; border:1px solid #4a4d58; border-radius:5px;
    font-size:10.5px; font-weight:bold; transition:all 0.2s;
  }
  #ui .fila button:hover { background:#32343e; }
  #ui .fila button.encender { border-color:#10b981; color:#10b981; }
  #ui .fila button.encender:hover { background:rgba(16,185,129,0.18); }
  #ui .fila button.apagar   { border-color:#ef4444; color:#ef4444; }
  #ui .fila button.apagar:hover { background:rgba(239,68,68,0.18); }
  #btnEst { margin-bottom:8px; display:flex; flex-direction:column; gap:4px; max-height:230px; overflow-y:auto; }
  #btnEst button {
    padding:6px 10px; cursor:pointer;
    background:#1b1c21; color:#ccc; border:1px solid #363942; border-radius:5px;
    font-size:11px; display:flex; align-items:center; justify-content:space-between;
    width:100%; text-align:left; transition:all 0.2s;
  }
  #btnEst button:hover { background:#2a2b34; color:#fff; border-color:#5c6070; }
  #btnEst button.activo { border-color:#10b981; color:#10b981; background:rgba(16,185,129,0.14); font-weight:600; }
  #btnEst button.en-camino { border-color:#f59e0b; color:#f59e0b; background:rgba(245,158,11,0.14); }
  #ui label { display:inline-flex; align-items:center; gap:5px; margin-right:12px; font-size:11.5px; color:#bbb; cursor:pointer; }
  #opStatus {
    margin:8px 0; padding:6px 10px; background:#16171d; border-radius:5px;
    border-left:3px solid #10b981; font-size:11px; color:#10b981; font-weight:600;
  }
  #ui .ayuda { color:#828796; font-size:10.5px; margin-top:8px; line-height:1.4; border-top:1px solid #282a32; padding-top:6px; }
  #badgeInfo {
    position:absolute; bottom:12px; right:12px; z-index:100;
    background:rgba(15,15,18,0.88); color:#f59e0b; font-size:11.5px; font-weight:600;
    padding:8px 14px; border-radius:6px; border:1px solid #f59e0b; pointer-events:none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="ui">
  <h3>Centro de Simuladores SCADA</h3>
  <div class="fila">
    <button id="btnAllOn" class="encender">[ ENCENDER TODOS ]</button>
    <button id="btnAllOff" class="apagar">[ APAGAR TODOS ]</button>
  </div>
  <div id="btnEst"></div>
  <div id="opStatus">🚪 Operarios: En espera en puerta de acceso</div>
  <div>
    <label><input type="checkbox" id="chkSeguir" checked> Seguir operario</label>
    <label><input type="checkbox" id="chkGirar"> Girar vista</label>
    <label><input type="checkbox" id="chkRejilla"> Grilla</label>
  </div>
  <div class="ayuda">
    💡 Clic en botón o directamente en el puesto 3D. El operario ingresa por la puerta, cruza la línea amarilla y se sube al simulador.
  </div>
</div>
<div id="badgeInfo">⚠️ Línea Amarilla: Zona de Visitantes (No Pasar) · Simuladores en Sector Operativo</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// 1. CONSTANTES DE COTAS Y MATERIALES SCADA
// ═══════════════════════════════════════════════════════════════════
const COTA = {
  SUELO:      0.000,
  REJILLA:    0.003,
  LINEA:      0.005,
  CHAPA:      0.540,
  ALFOMBRA:   0.543,
  COJIN:      0.850,
  BUTACA_Z:   0.220,
  COL_Z:     -0.460,
  PEDAL_Z:   -0.150,
  POD_X:      0.360,
  MON_Y:      1.300,
  MON_FZ:    -1.450,
  MON_RZ:     1.150,
  MON_LX:     0.980,
  MON_LZ:    -1.350,
  MON_ROTY:   0.550,
  DISPLAY_Z:  0.027,
  DELTA:      0.003
};

const M = {
  metalClaro: new THREE.MeshStandardMaterial({color:0xb8bcc2, metalness:0.75, roughness:0.35}),
  metalMedio: new THREE.MeshStandardMaterial({color:0x8a8f96, metalness:0.7,  roughness:0.4}),
  metalOscuro:new THREE.MeshStandardMaterial({color:0x3c3f45, metalness:0.6,  roughness:0.5}),
  negro:      new THREE.MeshStandardMaterial({color:0x141416, roughness:0.9}),
  asiento:    new THREE.MeshStandardMaterial({color:0x1d1d20, roughness:0.85}),
  plastico:   new THREE.MeshStandardMaterial({color:0x2a2a2e, roughness:0.6}),
  goma:       new THREE.MeshStandardMaterial({color:0x0c0c0c, roughness:1.0}),
  rojo:       new THREE.MeshStandardMaterial({color:0xb02020, roughness:0.5}),
  amarillo:   new THREE.MeshStandardMaterial({color:0xffc21c, roughness:0.45}),
  estop:      new THREE.MeshStandardMaterial({color:0xef4444, roughness:0.4}),
  alfombra:   new THREE.MeshStandardMaterial({color:0x1a1a1c, roughness:1.0}),
  hormigon:   new THREE.MeshStandardMaterial({color:0x222327, roughness:0.95}),
  sueloVisit: new THREE.MeshStandardMaterial({color:0x2c2d35, roughness:0.92}),
  sueloOper:  new THREE.MeshStandardMaterial({color:0x1a1b20, roughness:0.96}),
  vial:       new THREE.MeshStandardMaterial({color:0xf59e0b, roughness:0.65}),
  vialNegro:  new THREE.MeshStandardMaterial({color:0x151518, roughness:0.85}),
  chaleco:    new THREE.MeshStandardMaterial({color:0xea580c, roughness:0.7}),
  reflectivo: new THREE.MeshStandardMaterial({color:0xd1d5db, metalness:0.5, roughness:0.25}),
  cascoOp:    new THREE.MeshStandardMaterial({color:0xfacc15, roughness:0.45}),
  piel:       new THREE.MeshStandardMaterial({color:0xb97a56, roughness:0.8})
};

// ═══════════════════════════════════════════════════════════════════
// 2. ESCENA, CÁMARA, RENDERER Y CONTROLES
// ═══════════════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17181c);
scene.fog = new THREE.Fog(0x17181c, 25, 75);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10.5, 9.5, 12.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.minDistance = 2;
controls.maxDistance = 50;

// ═══════════════════════════════════════════════════════════════════
// 3. ILUMINACIÓN GENERAL
// ═══════════════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x9aa5b5, 0.50));

const key = new THREE.DirectionalLight(0xffffff, 0.95);
key.position.set(10, 14, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -16; key.shadow.camera.right = 16;
key.shadow.camera.top = 16;   key.shadow.camera.bottom = -16;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8899bb, 0.35);
fill.position.set(-8, 6, -6);
scene.add(fill);

// ═══════════════════════════════════════════════════════════════════
// 4. HELPERS GEOMÉTRICOS
// ═══════════════════════════════════════════════════════════════════
function mesh(geo, mat, x=0, y=0, z=0, cast=true, recv=true){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  m.castShadow = cast; m.receiveShadow = recv;
  return m;
}
function box(w,h,d,mat,x,y,z){ return mesh(new THREE.BoxGeometry(w,h,d), mat, x,y,z); }
function cyl(rt,rb,h,mat,x,y,z,seg=24){ return mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat, x,y,z); }

function hinge(px, py, pz, rotX){
  const g = new THREE.Group();
  g.position.set(px, py, pz);
  g.rotation.x = rotX;
  return g;
}

// ═══════════════════════════════════════════════════════════════════
// 5. ENTORNO — PISO, GRILLA Y LA LÍNEA AMARILLA CONTINUA DE SEGURIDAD
// ═══════════════════════════════════════════════════════════════════
const piso = mesh(new THREE.PlaneGeometry(28, 22), M.hormigon, 0, COTA.SUELO, 0, false, true);
piso.rotation.x = -Math.PI/2;
scene.add(piso);

const grid = new THREE.GridHelper(28, 28, 0x555558, 0x2c2c30);
grid.position.y = COTA.REJILLA;
grid.visible = false;
scene.add(grid);

// Helper para trazar texto stencileado en el suelo
function crearTextoPiso(texto, x, z, rotZ, w, h){
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f59e0b';
  ctx.font = 'bold 44px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(texto, 512, 64);

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const m = mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({
    map: tex, transparent: true, opacity: 0.88, roughness: 0.8,
    polygonOffset: true, polygonOffsetFactor: -1
  }), x, COTA.LINEA + 0.001, z, false, true);
  m.rotation.x = -Math.PI/2;
  m.rotation.z = rotZ;
  scene.add(m);
}

// LÍNEA AMARILLA ÚNICA CONTINUA QUE DELIMITA LA ZONA OPERATIVA
function crearLineaSeguridadUnica(){
  const g = new THREE.Group();
  scene.add(g);
  const esp = 0.14; // 14 cm de ancho

  // Helper para trazar un segmento sólido entre dos puntos (x1,z1) y (x2,z2)
  function tramo(x1, z1, x2, z2){
    const dx = x2 - x1;
    const dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const mx = (x1 + x2) / 2;
    const mz = (z1 + z2) / 2;

    const b = box(esp, 0.005, len, M.vial, mx, COTA.LINEA, mz);
    b.rotation.y = -Math.atan2(dz, dx) + Math.PI / 2;
    g.add(b);

    // Vértice redondeado para empalme perfecto en esquinas
    const cap = cyl(esp/2, esp/2, 0.005, M.vial, x1, COTA.LINEA, z1, 16);
    g.add(cap);
    return b;
  }

  // Vértices de la línea amarilla continua que bordea TODOS los simuladores
  const pts = [
    [ 4.8,  5.8],  // Inicio frente a la puerta de ingreso
    [ 4.8, -2.4],  // Recto frente a Autoelevador
    [ 3.4, -3.8],  // Chaflán 45° frente a Pala Frontal
    [-3.4, -3.8],  // Recto frente a Retroexcavadora
    [-4.6, -2.4],  // Chaflán 45° frente a Grúa Telescópica
    [-4.6,  2.8],  // Recto frente a Tractor y Camión
    [-4.6,  5.8],  // Lateral de SimSpray
    [-0.6,  5.8]   // Frente de SimSpray
  ];

  for(let i = 0; i < pts.length - 1; i++){
    tramo(pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]);
  }
  // Cap final
  const last = pts[pts.length - 1];
  g.add(cyl(esp/2, esp/2, 0.005, M.vial, last[0], COTA.LINEA, last[1], 16));

  // Textos pintados en el suelo para visitantes
  crearTextoPiso("⚠️ LÍNEA DE SEGURIDAD — ÁREA DE SIMULADORES (PROHIBIDO PASAR)", 0.2, 6.7, 0, 7.8, 0.35);

  // Puerta de acceso peatonal en [6.8, 5.8]
  const lUmbral = box(1.2, 0.005, esp, M.vial, 6.8, COTA.LINEA, 5.8);
  g.add(lUmbral);
  const jambaI = box(esp, 0.005, 0.6, M.vial, 6.2, COTA.LINEA, 5.8);
  g.add(jambaI);
  const jambaD = box(esp, 0.005, 0.6, M.vial, 7.4, COTA.LINEA, 5.8);
  g.add(jambaD);

  crearTextoPiso("ACCESO EXCLUSIVO OPERARIOS", 6.8, 5.2, 0, 1.8, 0.25);

  return g;
}

// ═══════════════════════════════════════════════════════════════════
// 6. CONSTRUCTOR DE CABINA DE SIMULADOR
// ═══════════════════════════════════════════════════════════════════
function crearEstacion(cfg){
  const E = new THREE.Group();
  E.name = 'Estacion_' + cfg.nombre;
  E.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
  E.rotation.y = cfg.rotY;
  scene.add(E);

  const estStatic = new THREE.Group();
  E.add(estStatic);
  const DC = new THREE.Group();
  E.add(DC);

  const matPantalla = new THREE.MeshStandardMaterial({
    color:0x0a0a0a, roughness:0.25, emissive:0x000000, emissiveIntensity:0.0
  });
  const luz = new THREE.PointLight(0xfff1d6, 0, 6.0);
  luz.position.set(0.6, 2.3, 0.6);
  estStatic.add(luz);

  function monitor(w, h){
    const g = new THREE.Group();
    g.add(box(w, h, 0.045, M.negro));
    const scr = box(w - 0.06, h - 0.06, 0.01, matPantalla);
    scr.position.z = COTA.DISPLAY_Z;
    g.add(scr);
    g.add(box(0.10, 0.015, 0.005, M.metalOscuro, 0, -h/2 + 0.015, 0.028));
    return g;
  }
  function torreFrontal(){
    const t = new THREE.Group();
    t.position.set(0, 0, COTA.MON_FZ);
    t.add(box(0.50, 0.04, 0.40, M.negro, 0, 0.02, 0));
    t.add(cyl(0.035, 0.035, 0.98, M.negro, 0, 0.53, 0));
    const m = monitor(0.96, 0.56);
    m.position.set(0, COTA.MON_Y, 0);
    m.rotation.x = -0.04;
    t.add(m);
    return t;
  }
  function torreTrasera(){
    const t = new THREE.Group();
    t.position.set(0, 0, COTA.MON_RZ);
    t.rotation.y = Math.PI;
    t.add(box(0.50, 0.04, 0.40, M.negro, 0, 0.02, 0));
    t.add(cyl(0.035, 0.035, 0.98, M.negro, 0, 0.53, 0));
    const m = monitor(0.96, 0.56);
    m.position.set(0, COTA.MON_Y, 0);
    m.rotation.x = -0.04;
    t.add(m);
    return t;
  }
  function pedestalLateral(xL, rotY){
    const p = new THREE.Group();
    p.position.set(xL, 0, COTA.MON_LZ);
    p.rotation.y = rotY;
    p.add(box(0.45, 0.04, 0.40, M.negro, 0, 0.02, 0));
    p.add(cyl(0.028, 0.028, 0.98, M.negro, 0, 0.53, 0));
    const m = monitor(0.96, 0.56);
    m.position.set(0, COTA.MON_Y, 0);
    m.rotation.x = -0.04;
    p.add(m);
    return p;
  }

  estStatic.add(torreFrontal());
  if(cfg.pantallas === 'bi_pantalla'){ estStatic.add(torreTrasera()); }
  if(cfg.pantallas === 'triple'){
    estStatic.add(pedestalLateral(-COTA.MON_LX,  COTA.MON_ROTY));
    estStatic.add(pedestalLateral( COTA.MON_LX, -COTA.MON_ROTY));
  }

  // Chasis base con alfombra y ruedas
  const chasis = new THREE.Group();
  DC.add(chasis);
  chasis.add(box(1.50, 0.38, 1.40, M.metalClaro, 0, 0.31, 0));
  chasis.add(box(1.58, 0.04, 1.48, M.metalMedio, 0, 0.52, 0));
  chasis.add(box(1.42, 0.10, 1.32, M.metalOscuro, 0, 0.07, 0));
  [[-0.65, 0.60], [0.65, 0.60], [-0.65, -0.60], [0.65, -0.60]].forEach(([x, z]) => {
    chasis.add(cyl(0.045, 0.045, 0.12, M.metalOscuro, x, 0.06, z));
    chasis.add(cyl(0.060, 0.060, 0.02, M.goma,        x, 0.01, z));
  });
  [[-0.76,  0.55], [0.76, 0.55], [-0.76, -0.55], [0.76, -0.55]].forEach(([x, z]) => {
    const rueda = cyl(0.070, 0.070, 0.055, M.goma, x, 0.070, z, 20);
    rueda.rotation.z = Math.PI/2; chasis.add(rueda);
    const llanta = cyl(0.036, 0.036, 0.062, M.metalOscuro, x, 0.070, z, 14);
    llanta.rotation.z = Math.PI/2; chasis.add(llanta);
  });
  chasis.add(box(0.42, 0.09, 0.006, M.plastico, 0, 0.32, 0.706));
  DC.add(box(1.30, 0.003, 1.20, M.alfombra, 0, COTA.ALFOMBRA - COTA.DELTA/2, 0));

  // Butaca con fuelle y cinturón
  const butaca = new THREE.Group();
  butaca.position.set(0, 0, COTA.BUTACA_Z);
  DC.add(butaca);
  butaca.add(box(0.42, 0.04, 0.42, M.metalOscuro, 0, 0.563, 0));
  for(let i = 0; i < 4; i++){
    butaca.add(cyl(0.17 - i*0.012, 0.18 - i*0.012, 0.04, M.goma, 0, 0.602 + i*0.038, 0, 20));
  }
  butaca.add(box(0.40, 0.03, 0.45, M.metalOscuro, 0, 0.751, 0));
  butaca.add(box(0.48, 0.084, 0.48, M.asiento, 0, 0.808, 0));

  const bisagraRespaldo = hinge(0, 0.845, 0.240, 0.12);
  butaca.add(bisagraRespaldo);
  bisagraRespaldo.add(box(0.46, 0.62, 0.10, M.asiento, 0, 0.31, 0));
  bisagraRespaldo.add(box(0.40, 0.18, 0.09, M.asiento, 0, 0.70, 0.01));
  const cinturon = box(0.05, 0.64, 0.01, M.negro, -0.10, 0.33, -0.055);
  cinturon.rotation.z = 0.32;
  bisagraRespaldo.add(cinturon);

  // Pedalera
  const pedalera = new THREE.Group();
  pedalera.position.set(0, 0, COTA.PEDAL_Z);
  DC.add(pedalera);
  const pedalBaseY = COTA.ALFOMBRA + 0.04;
  pedalera.add(box(0.42, 0.04, 0.22, M.metalOscuro, 0, COTA.ALFOMBRA + 0.02, 0));
  [-0.13, 0, 0.13].forEach((x) => {
    const bisagraPedal = hinge(x, pedalBaseY, 0.08, -0.35);
    pedalera.add(bisagraPedal);
    bisagraPedal.add(box(0.07, 0.15, 0.012, M.metalClaro, 0, 0.075, 0));
    pedalera.add(box(0.03, 0.05, 0.02, M.metalOscuro, x, pedalBaseY + 0.02, 0.10));
  });

  // Mandos según máquina
  let volanteObj = null;
  if(cfg.mandos === 'volante_industrial'){
    const moduloVolante = new THREE.Group();
    moduloVolante.position.set(0, 0, COTA.COL_Z);
    DC.add(moduloVolante);
    const bisagraCol = hinge(0, COTA.CHAPA, 0, 0.24);
    moduloVolante.add(bisagraCol);
    bisagraCol.add(box(0.24, 0.72, 0.16, M.metalMedio, 0, 0.36, 0));
    const consola = box(0.44, 0.08, 0.28, M.plastico, 0, 0.51, -0.02);
    bisagraCol.add(consola);
    consola.add(box(0.40, 0.015, 0.22, M.metalOscuro, 0, 0.0475, 0));
    for(let i = 0; i < 5; i++){
      consola.add(cyl(0.018, 0.018, 0.025, M.goma, -0.14 + i*0.07, 0.0675, 0.00, 12));
    }
    consola.add(cyl(0.036, 0.042, 0.018, M.negro, 0.14, 0.064, -0.07, 16));
    consola.add(cyl(0.026, 0.026, 0.028, M.estop, 0.14, 0.087, -0.07, 16));
    
    volanteObj = new THREE.Group();
    volanteObj.position.set(0, 0.80, 0.28);
    volanteObj.rotation.x = -0.55;
    bisagraCol.add(volanteObj);
    volanteObj.add(mesh(new THREE.TorusGeometry(0.19, 0.022, 12, 40), M.goma));
    volanteObj.add(cyl(0.055, 0.055, 0.04, M.plastico, 0, 0, 0).rotateX(Math.PI/2));
    for(let k = 0; k < 3; k++){
      const a = Math.PI + k * Math.PI*2/3;
      const radio = box(0.028, 0.15, 0.03, M.plastico, Math.sin(a)*0.12, Math.cos(a)*0.12, 0);
      radio.rotation.z = -a;
      volanteObj.add(radio);
    }
    const tramoColumna = cyl(0.028, 0.028, 0.22, M.metalMedio, 0, 0, -0.13, 16);
    tramoColumna.rotation.x = Math.PI/2;
    volanteObj.add(tramoColumna);
    volanteObj.add(mesh(new THREE.SphereGeometry(0.03, 14, 10), M.negro, 0, 0.19, 0));

    const bloque = box(0.16, 0.08, 0.34, M.metalOscuro, 0.34, COTA.ALFOMBRA + 0.04, 0.10);
    DC.add(bloque);
    for(let i = 0; i < 4; i++){

  if(cfg.mandos === 'joysticks_duales'){

      const bisagraPalanca = hinge(0, rotulaY, 0, -0.15);

      bisagraPalanca.add(box(0.05, 0.10, 0.04, M.goma, 0, 0.23, 0));
      bisagraPalanca.add(cyl(0.013, 0.013, 0.018, M.rojo, 0, 0.289, 0.004, 12));
    });
  }

  if(cfg.mandos === 'volante_camion'){
    const moduloVolante = new THREE.Group();
    moduloVolante.position.set(0, 0, COTA.COL_Z);
    DC.add(moduloVolante);
    const bisagraCol = hinge(0, COTA.CHAPA, 0, 0.45);
    moduloVolante.add(bisagraCol);
    bisagraCol.add(box(0.24, 0.55, 0.16, M.metalMedio, 0, 0.275, 0));
    const consola = box(0.44, 0.08, 0.28, M.plastico, 0, 0.53, -0.02);
    bisagraCol.add(consola);
    consola.add(box(0.40, 0.015, 0.22, M.metalOscuro, 0, 0.0475, 0));
    for(let i = 0; i < 5; i++){
      consola.add(cyl(0.018, 0.018, 0.025, M.goma, -0.14 + i*0.07, 0.0675, 0.00, 12));
    }
    consola.add(cyl(0.036, 0.042, 0.018, M.negro, 0.14, 0.064, -0.07, 16));
    consola.add(cyl(0.026, 0.026, 0.028, M.estop, 0.14, 0.087, -0.07, 16));

    volanteObj = new THREE.Group();
    volanteObj.position.set(0, 0.62, 0.18);

    bisagraCol.add(volanteObj);
    volanteObj.add(mesh(new THREE.TorusGeometry(0.24, 0.026, 12, 44), M.goma));
    volanteObj.add(cyl(0.06, 0.06, 0.05, M.plastico, 0, 0, 0).rotateX(Math.PI/2));
    for(let k = 0; k < 4; k++){
      const a = k * Math.PI/2;

    const ejeCamion = cyl(0.030, 0.030, 0.28, M.metalMedio, 0, 0, -0.16, 16);
    ejeCamion.rotation.x = Math.PI/2;
    volanteObj.add(ejeCamion);
    volanteObj.add(mesh(new THREE.SphereGeometry(0.034, 14, 10), M.negro, 0, 0.24, 0));

    const bisagraCambio = hinge(0.30, COTA.ALFOMBRA, 0.05, 0.10);

  // Casco descansando en la butaca cuando la máquina está libre
  const cascoButaca = new THREE.Group();

  cascoButaca.add(box(0.16, 0.012, 0.08, M.cascoOp, 0, -0.002, 0.095));

  return {

// 7. ESTACIÓN 7 — SIMSPRAY PINTURA VR (CON CASCO VR Y PISTOLA)
// ═══════════════════════════════════════════════════════════════════
function crearSimspray(cfg){
  const E = new THREE.Group();
  E.name = 'Estacion_' + cfg.nombre;
  E.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
  E.rotation.y = cfg.rotY;
  scene.add(E);

  const matPantalla = new THREE.MeshStandardMaterial({
    color:0x0a0a0a, roughness:0.25, emissive:0x000000, emissiveIntensity:0.0
  });
  const luz = new THREE.PointLight(0xfff1d6, 0, 6.0);
  luz.position.set(0, 2.3, -0.3);
  E.add(luz);

  // 1. Chasis / Carro rodante de la unidad SimSpray
  E.add(box(0.68, 0.06, 0.52, M.metalOscuro, 0, 0.03, 0));
  [[-0.26, -0.18], [0.26, -0.18], [-0.26, 0.18], [0.26, 0.18]].forEach(([rx, rz]) => {
    const rueda = cyl(0.045, 0.045, 0.035, M.goma, rx, 0.045, rz, 16);
    rueda.rotation.z = Math.PI/2;
    E.add(rueda);
  });

  // Gabinete vertical principal (debajo de la V de sensores)
  E.add(box(0.52, 1.58, 0.36, M.metalOscuro, 0, 0.85, 0));
  E.add(box(0.54, 0.04, 0.38, M.metalMedio, 0, 1.65, 0));

  // 2. Pantalla táctil del instructor / menú (mira hacia el frente -Z)
  E.add(box(0.44, 0.58, 0.02, M.negro, 0, 1.28, -0.19));
  const tactil = box(0.40, 0.52, 0.015, matPantalla, 0, 1.28, -0.20);
  tactil.rotation.x = 0.10;
  E.add(tactil);

  // 3. DOS BRAZOS EN FORMA DE "V" CON SENSORES DE TRACKING ÓPTICO
  // Salen del simulador hacia arriba abriéndose en V y debajo queda el simulador
  const soporteV = box(0.16, 0.05, 0.16, M.metalMedio, 0, 1.68, 0);
  E.add(soporteV);

  function crearRamaSensor(esIzq){
    const s = esIzq ? -1 : 1;
    const rama = new THREE.Group();
    rama.position.set(s * 0.06, 1.70, 0);
    rama.rotation.z = -s * 0.52; // Ángulo de apertura en V (30°)
    rama.rotation.x = -0.16;     // Inclinación hacia adelante (-Z) hacia el operario

    // Brazo tubular metálico
    rama.add(cyl(0.015, 0.018, 0.65, M.metalOscuro, 0, 0.325, 0, 16));

    // Cabezal sensor en el extremo
    const cabezal = new THREE.Group();
    cabezal.position.set(0, 0.65, 0);
    cabezal.rotation.z = s * 0.52;
    cabezal.rotation.x = 0.20;
    cabezal.add(box(0.07, 0.08, 0.10, M.negro, 0, 0, 0));
    const lente = cyl(0.024, 0.024, 0.012, M.metalClaro, 0, 0, -0.055, 16);
    lente.rotation.x = Math.PI/2;
    cabezal.add(lente);
    cabezal.add(mesh(new THREE.SphereGeometry(0.015, 12, 8), M.estop, 0, 0, -0.058));
    rama.add(cabezal);

    return rama;
  }
  E.add(crearRamaSensor(true));  // Rama izquierda de la V
  E.add(crearRamaSensor(false)); // Rama derecha de la V

  // 4. Soporte para visor VR colgado (en el lateral izquierdo)
  E.add(box(0.12, 0.02, 0.04, M.metalMedio, -0.32, 1.15, -0.05));
  const visor = box(0.18, 0.11, 0.09, M.negro, -0.40, 1.08, -0.05);
  visor.rotation.y = -0.20;
  E.add(visor);
  E.add(box(0.19, 0.015, 0.02, M.goma, -0.40, 1.145, -0.05));

  // 5. Pistola aerográfica colgada (en el lateral derecho)
  E.add(box(0.12, 0.02, 0.04, M.metalMedio, 0.32, 1.12, -0.05));
  const pistola = new THREE.Group();
  pistola.position.set(0.40, 1.02, -0.05);
  E.add(pistola);
  pistola.add(box(0.05, 0.14, 0.05, M.metalClaro, 0, 0, 0));
  pistola.add(cyl(0.012, 0.016, 0.08, M.metalMedio, 0, -0.10, 0, 12));
  pistola.add(box(0.02, 0.05, 0.03, M.negro, 0, 0.04, -0.035));
  pistola.add(cyl(0.018, 0.018, 0.05, M.goma, 0, 0.095, 0, 12));

  // Manguera flexible desde el gabinete hasta la pistola
  const puntosManguera = [
    new THREE.Vector3(0.20, 0.08, -0.05),
    new THREE.Vector3(0.36, 0.15, -0.05),
    new THREE.Vector3(0.42, 0.50, -0.05),
    new THREE.Vector3(0.40, 0.92, -0.05)
  ];
  E.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(puntosManguera), 30, 0.014, 10), M.goma));

  return {
    nombre: cfg.nombre, cfg: cfg, grupo: E, DC: null, butaca: null,
    matPantalla: matPantalla, luz: luz, volanteObj: null,
    visorColgado: visor, pistolaColgada: pistola,
    cascoButaca: null, seed: cfg.seed, enOperacion: false
  };
}

function crearOperario(id, colorChaleco=0xea580c){
  const root = new THREE.Group();
  root.name = 'Operario_' + id;
  root.visible = false;
  scene.add(root);

  // Ubicación inicial en el umbral de la puerta
  root.position.set(6.8, 0, 6.0);
  root.rotation.y = -Math.PI/2;

  const pelvis = new THREE.Group();
  pelvis.position.y = 0.92;
  root.add(pelvis);

  // Tronco con chaleco reflectivo
  const matChaleco = new THREE.MeshStandardMaterial({color: colorChaleco, roughness: 0.7});
  const torso = new THREE.Group();
  pelvis.add(torso);
  const pecho = box(0.34, 0.44, 0.22, matChaleco, 0, 0.22, 0);
  torso.add(pecho);
  torso.add(box(0.35, 0.035, 0.225, M.reflectivo, 0, 0.14, 0));
  torso.add(box(0.35, 0.035, 0.225, M.reflectivo, 0, 0.28, 0));

  // Cabeza y casco
  // NOTA: El frente de la persona mira hacia +Z local (visera en +0.085)
  const cuello = cyl(0.05, 0.05, 0.08, M.piel, 0, 0.48, 0);
  torso.add(cuello);
  const cabeza = box(0.16, 0.15, 0.15, M.piel, 0, 0.58, 0);
  torso.add(cabeza);
  const casco = mesh(new THREE.SphereGeometry(0.098, 18, 12, 0, Math.PI*2, 0, Math.PI/2), M.cascoOp, 0, 0.65, 0);
  torso.add(casco);
  const visera = box(0.13, 0.012, 0.06, M.cascoOp, 0, 0.62, 0.085);
  torso.add(visera);

  // Visor VR en la cabeza (para SimSpray)
  const visorVR = box(0.18, 0.10, 0.09, M.negro, 0, 0.58, 0.09);
  visorVR.visible = false;
  torso.add(visorVR);

  // Brazos
  function crearBrazo(esIzq){
    const s = esIzq ? -1 : 1;
    const hombro = new THREE.Group();
    hombro.position.set(s * 0.21, 0.38, 0);
    torso.add(hombro);

    const brazoSup = box(0.085, 0.22, 0.085, matChaleco, 0, -0.11, 0);
    hombro.add(brazoSup);

    const codo = new THREE.Group();
    codo.position.set(0, -0.22, 0);
    hombro.add(codo);

    const antebrazo = box(0.075, 0.20, 0.075, M.piel, 0, -0.10, 0);
    codo.add(antebrazo);
    const mano = box(0.065, 0.065, 0.065, M.piel, 0, -0.21, 0);
    codo.add(mano);

    return { hombro, codo, antebrazo, mano };
  }
  const brazoIzq = crearBrazo(true);
  const brazoDer = crearBrazo(false);

  // Pistola aerográfica en mano derecha (para SimSpray)
  const pistolaMano = new THREE.Group();
  pistolaMano.position.set(0, -0.21, 0.08);
  pistolaMano.add(box(0.04, 0.12, 0.04, M.metalClaro, 0, 0, 0));
  pistolaMano.add(cyl(0.010, 0.014, 0.07, M.metalMedio, 0, -0.08, 0, 10));
  pistolaMano.visible = false;
  brazoDer.codo.add(pistolaMano);

  // Piernas
  function crearPierna(esIzq){
    const s = esIzq ? -1 : 1;
    const cadera = new THREE.Group();
    cadera.position.set(s * 0.10, 0, 0);
    pelvis.add(cadera);

    const muslo = box(0.12, 0.42, 0.12, M.negro, 0, -0.21, 0);
    cadera.add(muslo);

    const rodilla = new THREE.Group();
    rodilla.position.set(0, -0.42, 0);
    cadera.add(rodilla);

    const pantorrilla = box(0.10, 0.40, 0.10, M.negro, 0, -0.20, 0);
    rodilla.add(pantorrilla);

    const bota = box(0.11, 0.08, 0.22, M.goma, 0, -0.41, 0.05);
    rodilla.add(bota);

    return { cadera, rodilla, bota };
  }
  const piernaIzq = crearPierna(true);
  const piernaDer = crearPierna(false);

  return {
    id, root, pelvis, torso, brazoIzq, brazoDer, piernaIzq, piernaDer,
    pistolaMano, visorVR,
    estado: 'inactivo',       // 'inactivo' | 'caminando' | 'subiendo' | 'operando' | 'bajando' | 'saliendo'
    estacion: null,

    fasePaso: 0,
    progresoSubida: 0,
    progresoBajada: 0,
    posInicioAccion: new THREE.Vector3(),
    rotInicioAccion: 0
  };
}

// Puntos clave de acceso con rotación correcta para que la persona mire hacia el frente (volante y pantallas)
function getPuntosEstacion(cfg){
  const aMundo = (lx, ly, lz) => {
    const v = new THREE.Vector3(lx, ly, lz);
    v.applyAxisAngle(new THREE.Vector3(0, 1, 0), cfg.rotY);
    v.add(new THREE.Vector3(cfg.pos[0], cfg.pos[1], cfg.pos[2]));
    return v;
  };

  if(cfg.tipo === 'simspray'){
    return {
      acceso: aMundo(0.80, 0, -1.15),      // Aproximación lateral por el pasillo despejado
      subida: aMundo(0.40, 0, -1.15),      // Paso de entrada frente al simulador
      plataforma: aMundo(0, 0, -1.15),     // Posición de pie en el área de tracking bajo la V
      rotFinal: cfg.rotY                   // Mirando de frente hacia el simulador y los sensores V
    };
  }

  return {
    acceso: aMundo(-1.20, 0, 0.25),               // Al costado de la butaca
    subida: aMundo(-0.60, 0, 0.25),               // En el escalón de la alfombra del chasis
    plataforma: aMundo(0, 0, COTA.BUTACA_Z),      // Centro de la butaca
    rotFinal: cfg.rotY + Math.PI                  // ¡MIRANDO DIRECTO A LOS MONITORES Y VOLANTE!
  };
}

// Ruta desde la puerta, cruzando la línea amarilla hacia el simulador
function planificarRutaDesdePuerta(destinoAcceso){
  const wps = [];
  wps.push(new THREE.Vector3(6.8, 0, 6.0));  // Umbral puerta
  wps.push(new THREE.Vector3(4.5, 0, 5.2));  // Zona visitantes frente a la puerta
  wps.push(new THREE.Vector3(2.0, 0, 4.0));  // Cruce de la línea amarilla hacia el centro
  if(destinoAcceso.z < 0){
    wps.push(new THREE.Vector3(0.0, 0, destinoAcceso.z + 1.5)); // Eje central
  }
  wps.push(new THREE.Vector3(destinoAcceso.x, 0, destinoAcceso.z)); // Acceso al simulador
  return wps;
}

// Ruta de regreso hacia la puerta para salir
function planificarRutaHaciaPuerta(origen){
  const wps = [];
  wps.push(new THREE.Vector3(origen.x, 0, origen.z));
  wps.push(new THREE.Vector3(2.0, 0, 4.0));
  wps.push(new THREE.Vector3(4.5, 0, 5.2));
  wps.push(new THREE.Vector3(6.8, 0, 6.0));
  return wps;
}

// Motor de animación para un operario específico
function actualizarOperarioIndividual(op, dt, t){
  if(!op || !op.root.visible) return;

  if(op.estado === 'caminando' || op.estado === 'saliendo'){
    op.root.position.y = 0;
    if(op.idxRuta < op.ruta.length){
      const targetWP = op.ruta[op.idxRuta];
      const dx = targetWP.x - op.root.position.x;
      const dz = targetWP.z - op.root.position.z;
      const dist = Math.hypot(dx, dz);

      if(dist < 0.25){
        op.idxRuta++;
      } else {
        const targetAngle = Math.atan2(dx, dz);
        let diff = targetAngle - op.root.rotation.y;
        while(diff < -Math.PI) diff += Math.PI * 2;
        while(diff > Math.PI) diff -= Math.PI * 2;
        op.root.rotation.y += diff * Math.min(1, dt * 9);

        const speed = 2.5;
        const stepDist = Math.min(dist, speed * dt);
        op.root.position.x += Math.sin(op.root.rotation.y) * stepDist;
        op.root.position.z += Math.cos(op.root.rotation.y) * stepDist;

        // Marcha articulada
        op.fasePaso += dt * 9.5;
        const swing = Math.sin(op.fasePaso);
        op.piernaIzq.cadera.rotation.x = swing * 0.60;
        op.piernaDer.cadera.rotation.x = -swing * 0.60;
        op.piernaIzq.rodilla.rotation.x = Math.max(0, -swing) * 0.70;
        op.piernaDer.rodilla.rotation.x = Math.max(0, swing) * 0.70;

        op.brazoIzq.hombro.rotation.x = -swing * 0.50;
        op.brazoDer.hombro.rotation.x = swing * 0.50;
        op.brazoIzq.codo.rotation.set(-0.25, 0, 0);
        op.brazoDer.codo.rotation.set(-0.25, 0, 0);

        op.pelvis.position.y = 0.92 + Math.abs(Math.sin(op.fasePaso)) * 0.04;
      }
    } else {
      if(op.estado === 'caminando'){
        // Llegó al acceso de la estación -> comenzar a subirse
        op.estado = 'subiendo';
        op.progresoSubida = 0.0;
        op.posInicioAccion.copy(op.root.position);
        op.rotInicioAccion = op.root.rotation.y;
      } else {
        // Llegó a la puerta -> salir del galpón
        op.estado = 'inactivo';
        op.root.visible = false;
        actualizarTextoEstadoGlobal();
      }
    }
  }
  else if(op.estado === 'subiendo'){
    op.progresoSubida += dt * 0.95;
    const p = Math.min(1.0, op.progresoSubida);
    const puntos = getPuntosEstacion(op.estacion.cfg);

    if(op.estacion.cfg.tipo === 'simspray'){
      op.root.position.lerpVectors(op.posInicioAccion, puntos.plataforma, p);
      op.root.position.y = 0;
      op.root.rotation.y = THREE.MathUtils.lerp(op.rotInicioAccion, puntos.rotFinal, p);
      op.pelvis.position.y = 0.92;
      op.brazoDer.hombro.rotation.set(-1.4 * p, 0, 0.2 * p);
      op.brazoDer.codo.rotation.set(-0.3 * p, 0, 0);
      op.brazoIzq.hombro.rotation.set(-0.6 * p, 0, -0.3 * p);
      if(p > 0.5){
        op.pistolaMano.visible = true;
        op.visorVR.visible = true;
        if(op.estacion.visorColgado) op.estacion.visorColgado.visible = false;
        if(op.estacion.pistolaColgada) op.estacion.pistolaColgada.visible = false;
      }
    } else {
      if(p < 0.45){
        // Fase 1: Subir escalón
        const t1 = p / 0.45;
        op.root.position.lerpVectors(op.posInicioAccion, puntos.subida, t1);
        op.root.position.y = COTA.ALFOMBRA * t1;
        op.pelvis.position.y = 0.92;
        op.piernaIzq.cadera.rotation.x = -0.7 * Math.sin(t1 * Math.PI);
        op.piernaIzq.rodilla.rotation.x = 0.8 * Math.sin(t1 * Math.PI);
        op.piernaDer.cadera.rotation.x = 0;
        op.piernaDer.rodilla.rotation.x = 0;
      } else {
        // Fase 2: Girar hacia el volante y sentarse mirando al frente
        const t2 = (p - 0.45) / 0.55;
        const ease = t2 * t2 * (3 - 2 * t2);
        op.root.position.lerpVectors(puntos.subida, puntos.plataforma, ease);
        op.root.position.y = COTA.ALFOMBRA;

        let diff = puntos.rotFinal - op.rotInicioAccion;
        while(diff < -Math.PI) diff += Math.PI * 2;
        while(diff > Math.PI) diff -= Math.PI * 2;
        op.root.rotation.y = op.rotInicioAccion + diff * ease;

        op.pelvis.position.y = THREE.MathUtils.lerp(0.92, 0.32, ease);

        // Piernas sentadas mirando hacia los pedales y pantallas
        op.piernaIzq.cadera.rotation.set((-Math.PI/2 + 0.08) * ease, -0.05 * ease, 0);
        op.piernaDer.cadera.rotation.set((-Math.PI/2 + 0.08) * ease,  0.05 * ease, 0);
        op.piernaIzq.rodilla.rotation.set((Math.PI/2 - 0.08) * ease, 0, 0);
        op.piernaDer.rodilla.rotation.set((Math.PI/2 - 0.08) * ease, 0, 0);

        // Brazos hacia los mandos
        const cfg = op.estacion.cfg;
        const angArm = cfg.mandos === 'volante_camion' ? -1.05 : -1.25;
        op.brazoIzq.hombro.rotation.set(angArm * ease, 0.15 * ease, -0.15 * ease);
        op.brazoDer.hombro.rotation.set(angArm * ease, -0.15 * ease, 0.15 * ease);
        op.brazoIzq.codo.rotation.set(-0.35 * ease, 0, 0);
        op.brazoDer.codo.rotation.set(-0.35 * ease, 0, 0);
      }
    }

    if(p >= 1.0){
      op.estado = 'operando';
      setEstadoInterno(op.estacion, true);
      if(op.estacion.cascoButaca) op.estacion.cascoButaca.visible = false;
      actualizarTextoEstadoGlobal();
    }
  }
  else if(op.estado === 'operando'){
    if(op.estacion){
      const puntos = getPuntosEstacion(op.estacion.cfg);
      const vib = (op.estacion.DC && op.estacion.enOperacion) ? op.estacion.DC.position.y : 0;

      if(op.estacion.cfg.tipo === 'simspray'){
        op.root.position.copy(puntos.plataforma);
        op.root.position.y = 0;
        op.root.rotation.y = puntos.rotFinal;
        op.pelvis.position.y = 0.92;
        const pintando = Math.sin(t * 3.0) * 0.12;
        op.brazoDer.hombro.rotation.y = pintando;
        op.brazoDer.hombro.rotation.x = -1.4 + Math.cos(t * 3.0) * 0.08;
      } else {
        op.root.position.copy(puntos.plataforma);
        op.root.position.y = COTA.ALFOMBRA + vib;
        op.root.rotation.y = puntos.rotFinal;
        op.pelvis.position.y = 0.32;

        const giro = Math.sin(t * 3.5 + op.estacion.seed) * 0.08;
        op.brazoIzq.hombro.rotation.z = -0.15 + giro;
        op.brazoDer.hombro.rotation.z =  0.15 + giro;
        if(op.estacion.volanteObj){
          op.estacion.volanteObj.rotation.z = -giro * 1.5;
        }
      }
    }
  }
  else if(op.estado === 'bajando'){
    op.progresoBajada += dt * 1.1;
    const p = Math.min(1.0, op.progresoBajada);
    const puntos = getPuntosEstacion(op.estacion.cfg);

    if(op.estacion.cfg.tipo === 'simspray'){
      op.root.position.lerpVectors(puntos.plataforma, puntos.acceso, p);
      op.root.position.y = 0;
      op.brazoDer.hombro.rotation.set(-1.4 * (1 - p), 0, 0.2 * (1 - p));
      if(p > 0.4){
        op.pistolaMano.visible = false;
        op.visorVR.visible = false;
        if(op.estacion.visorColgado) op.estacion.visorColgado.visible = true;
        if(op.estacion.pistolaColgada) op.estacion.pistolaColgada.visible = true;
      }
    } else {
      const ease = p * p * (3 - 2 * p);
      op.root.position.lerpVectors(puntos.plataforma, puntos.acceso, ease);
      op.root.position.y = COTA.ALFOMBRA * (1 - ease);
      op.pelvis.position.y = THREE.MathUtils.lerp(0.32, 0.92, ease);

      op.piernaIzq.cadera.rotation.x = (-Math.PI/2 + 0.08) * (1 - ease);
      op.piernaDer.cadera.rotation.x = (-Math.PI/2 + 0.08) * (1 - ease);
      op.piernaIzq.rodilla.rotation.x = (Math.PI/2 - 0.08) * (1 - ease);
      op.piernaDer.rodilla.rotation.x = (Math.PI/2 - 0.08) * (1 - ease);

      op.brazoIzq.hombro.rotation.set(0.08 * ease, 0, 0.05);
      op.brazoDer.hombro.rotation.set(0.08 * ease, 0, -0.05);
      op.brazoIzq.codo.rotation.set(-0.15, 0, 0);
      op.brazoDer.codo.rotation.set(-0.15, 0, 0);
    }

    if(p >= 1.0){
      if(op.estacion.cascoButaca) op.estacion.cascoButaca.visible = true;
      // Iniciar regreso a la puerta para salir
      op.ruta = planificarRutaHaciaPuerta(puntos.acceso);
      op.idxRuta = 0;
      op.estado = 'saliendo';
      actualizarTextoEstadoGlobal();
    }
  }
}

let ultimoOperarioActivo = null;
function actualizarTodosLosOperarios(dt, t){
  OPERARIOS.forEach(op => actualizarOperarioIndividual(op, dt, t));

  // Cámara sigue suavemente al último operario activo
  if(document.getElementById('chkSeguir')?.checked && ultimoOperarioActivo && ultimoOperarioActivo.root.visible){
    controls.target.lerp(new THREE.Vector3(ultimoOperarioActivo.root.position.x, 1.1, ultimoOperarioActivo.root.position.z), 0.04);
  }
}

function actualizarTextoEstadoGlobal(){
  const uiStatus = document.getElementById('opStatus');
  if(!uiStatus) return;
  const activos = OPERARIOS.filter(o => o.estado === 'operando').length;
  const enCamino = OPERARIOS.filter(o => o.estado === 'caminando' || o.estado === 'subiendo').length;

  if(activos > 0 || enCamino > 0){
    uiStatus.innerHTML = `👤 Operarios activos: <strong>${activos}</strong> en cabina · <strong>${enCamino}</strong> ingresando`;
    uiStatus.style.color = '#10b981';
  } else {
    uiStatus.textContent = `🚪 Operarios: En espera en puerta de acceso`;
    uiStatus.style.color = '#9ca3af';
  }
}

// Activar o desactivar un simulador individual despachando a su operario
function toggleSimulador(instIndex){
  const inst = INSTANCIAS[instIndex];
  const op = OPERARIOS[instIndex];
  ultimoOperarioActivo = op;

  if(inst.enOperacion || op.estado === 'operando' || op.estado === 'subiendo'){
    // Apagar simulador: el operario se baja y regresa a la puerta
    setEstadoInterno(inst, false);
    op.estado = 'bajando';
    op.progresoBajada = 0;
    if(inst.btn) inst.btn.classList.remove('activo', 'en-camino');
  } else {
    // Encender simulador: el operario ingresa por la puerta y va hacia el simulador
    op.estacion = inst;
    const puntos = getPuntosEstacion(inst.cfg);
    op.root.visible = true;
    op.root.position.set(6.8, 0, 6.0);
    op.ruta = planificarRutaDesdePuerta(puntos.acceso);
    op.idxRuta = 0;
    op.estado = 'caminando';
    if(inst.btn) inst.btn.classList.add('en-camino');
  }
  actualizarTextoEstadoGlobal();
}

// ═══════════════════════════════════════════════════════════════════
// 10. ESTADOS SCADA Y PANEL HUD
// ═══════════════════════════════════════════════════════════════════
function setEstadoInterno(inst, enOperacion){
  inst.enOperacion = enOperacion;
  if(enOperacion){
    inst.matPantalla.color.setHex(0x0d3327);
    inst.matPantalla.emissive.setHex(0x10b981);
    inst.matPantalla.emissiveIntensity = 0.85;
    inst.luz.intensity = 0.7;
  } else {
    inst.matPantalla.color.setHex(0x0a0a0a);
    inst.matPantalla.emissive.setHex(0x000000);
    inst.matPantalla.emissiveIntensity = 0.0;
    inst.luz.intensity = 0.0;
  }
  if(inst.btn){
    inst.btn.classList.toggle('activo', enOperacion);
    inst.btn.classList.remove('en-camino');
  }
}

const contBtn = document.getElementById('btnEst');
INSTANCIAS.forEach((inst, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span><strong>0${i + 1}</strong> · ${inst.nombre}</span> <span style="font-size:10px; opacity:0.8;">▶</span>`;
  b.onclick = () => toggleSimulador(i);
  contBtn.appendChild(b);
  inst.btn = b;
  setEstadoInterno(inst, false);
});

// Encender toda la nave: entran los 7 operarios escalonadamente
document.getElementById('btnAllOn').onclick = () => {
  INSTANCIAS.forEach((inst, i) => {
    if(!inst.enOperacion){
      setTimeout(() => {
        toggleSimulador(i);
      }, i * 280);
    }
  });
};

// Apagar toda la nave: todos los operarios se bajan y salen
document.getElementById('btnAllOff').onclick = () => {
  INSTANCIAS.forEach((inst, i) => {
    if(inst.enOperacion || OPERARIOS[i].estado === 'operando' || OPERARIOS[i].estado === 'subiendo'){
      toggleSimulador(i);
    }
  });
};

let rotar = false, ang = 0;
document.getElementById('chkGirar').onchange   = e => rotar = e.target.checked;
document.getElementById('chkRejilla').onchange = e => grid.visible = e.target.checked;

// Clic interactivo en el entorno 3D para activar simulador
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const startX = e.clientX, startY = e.clientY;
  function onPointerUp(eUp){
    renderer.domElement.removeEventListener('pointerup', onPointerUp);
    if(Math.hypot(eUp.clientX - startX, eUp.clientY - startY) > 6) return;
    mouse.x = (eUp.clientX / innerWidth) * 2 - 1;
    mouse.y = -(eUp.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(scene.children, true);
    for(const hit of hits){
      let obj = hit.object;
      while(obj && obj !== scene){
        const idx = INSTANCIAS.findIndex(inst => inst.grupo === obj);
        if(idx !== -1){
          toggleSimulador(idx);
          return;
        }
        obj = obj.parent;
      }
    }
  }
  renderer.domElement.addEventListener('pointerup', onPointerUp);
});

// ═══════════════════════════════════════════════════════════════════
// 11. BUCLE DE RENDER Y RESIZE
// ═══════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.08);
  const t = clock.getElapsedTime();

  // Vibración física DynamicCockpit
  INSTANCIAS.forEach((inst) => {
    if(inst.DC){
      inst.DC.position.y = inst.enOperacion ? Math.sin(t * 22 + inst.seed) * 0.002 : 0;
    }
  });

  // Cinemática en tiempo real de todos los operarios
  actualizarTodosLosOperarios(dt, t);

  if(rotar){
    ang += 0.0022;
    camera.position.x = Math.sin(ang) * 15;
    camera.position.z = Math.cos(ang) * 15;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
